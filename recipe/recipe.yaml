schema_version: 1

context:
  version: "2.0.0"

package:
  name: eoread
  version: ${{ version }}

source:
  url: https://github.com/hygeos/eoread/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7f37654a5c1982fd696003503db4536a46839f34a02d6afdb50a1bb6227424e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=2.0
  run:
    - python >=${{ python_min }},<3.14
    - hygeos-core >=2.0.2,<3.0
    - xarray
    - dask
    - numpy
    - rioxarray
    - rasterio
    - h5netcdf
    - h5py
    - netcdf4
    - pyhdf
    - pyproj
    - pandas
    - scipy
    - python-dateutil
    - pysolar
    - pyepr

tests:
  - python:
      imports:
        - eoread
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Modular implementation of satellite data input/output relying on xarray.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/hygeos/eoread

extra:
  recipe-maintainers:
    - fsteinmetz
    - danschef
